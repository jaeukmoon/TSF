name: weekly-leaderboard-update

on:
  schedule:
    - cron: "30 23 * * 0"   # Monday 08:30 KST, weekly
  workflow_dispatch:
    inputs:
      max_cards:
        description: "cards to generate this run (backfill: e.g. 60)"
        default: "12"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install anthropic

      - name: Update leaderboard + cards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_CARDS: ${{ inputs.max_cards || '12' }}
        run: python tracker/update.py

      - name: Commit & push if changed
        run: |
          git config user.name "tsf-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: weekly leaderboard update $(date -u +%F)"
          git push

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages --ref main
