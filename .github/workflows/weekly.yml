name: weekly-leaderboard-update

on:
  schedule:
    - cron: "30 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-leaderboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deterministic leaderboard ingestion
        run: python tracker/update.py

      - name: Commit and push changed data
        run: |
          git config user.name "tsf-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: weekly leaderboard update $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages --ref main
